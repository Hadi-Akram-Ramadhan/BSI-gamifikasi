services:
  postgres:
    image: postgres:16-alpine
    container_name: bsi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bsi_user
      POSTGRES_PASSWORD: bsi_password
      POSTGRES_DB: bsi_duel_cerdas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bsi_user -d bsi_duel_cerdas"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bsi_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
